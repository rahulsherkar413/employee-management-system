name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Angular App
        run: npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

      - name: Locate Output Directory
        id: locate-dist
        run: |
          echo "=== List dist directory ==="
          ls -R dist
          INDEX_PATH=$(find dist -type f -name "index.html" | head -n 1)
          BUILD_DIR=$(dirname "$INDEX_PATH")
          echo "Found build folder: $BUILD_DIR"
          echo "dist_path=$BUILD_DIR" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate-dist.outputs.dist_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
