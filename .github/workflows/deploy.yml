name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Locate, Install & Build Angular
        id: build
        run: |
          echo "=== Locating package.json ==="
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)

          if [ -z "$PKG_PATH" ]; then
            echo "❌ ERROR: package.json not found in repository!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "✅ Found package.json in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          echo "=== Installing Dependencies ==="
          npm install --legacy-peer-deps

          echo "=== Building Angular Project ==="
          npx ng build --configuration production --base-href /${{ github.event.repository.name }}/

          echo "=== Finding Built Output Folder ==="
          INDEX_PATH=$(find dist -name "index.html" 2>/dev/null | head -n 1)

          if [ -z "$INDEX_PATH" ]; then
            echo "❌ ERROR: index.html not found inside dist folder after build!"
            exit 1
          fi

          BUILD_DIR=$(dirname "$INDEX_PATH")
          FULL_PATH="$PROJECT_DIR/$BUILD_DIR"

          echo "✅ Dist folder located at: $FULL_PATH"
          echo "dist_path=$FULL_PATH" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.build.outputs.dist_path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
